# Firebase App Hosting configuration for Toronto Mosaic.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Keep warm instances during the event so the first QR scans aren't cold starts.
  # Drop minInstances to 0 after the event to stop billing for idle capacity.
  minInstances: 2
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # --- Public Firebase web config (safe to expose; access is governed by security rules) ---
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "REPLACE_ME"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "REPLACE_ME.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "REPLACE_ME"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "REPLACE_ME"
    availability: [BUILD, RUNTIME]

  # Canonical public URL used for QR codes and share links.
  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://mosaic.example.com"
    availability: [BUILD, RUNTIME]

  # --- Server-only ---
  # Comma-separated Google accounts allowed into /admin.
  - variable: ORGANIZER_EMAILS
    value: "organizer1@example.com,organizer2@example.com"
    availability: [RUNTIME]

  # Rehearsal tools are disabled in Firebase mode unless explicitly enabled.
  - variable: ALLOW_DEMO_SEED
    value: "false"
    availability: [RUNTIME]
  - variable: ALLOW_RESET
    value: "false"
    availability: [RUNTIME]

  # Optional Gemini captions. Create the secret with:
  #   firebase apphosting:secrets:set gemini-api-key
  # then uncomment:
  # - variable: GEMINI_API_KEY
  #   secret: gemini-api-key
  #   availability: [RUNTIME]
  # - variable: GEMINI_MODEL
  #   value: "gemini-2.5-flash"
  #   availability: [RUNTIME]
